<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat en Tiempo Real con WebSockets</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      height: 430px;
      overflow-y: auto;
      background-color: #fafbfc;
      border: 1px solid #e1e4e8;
      border-radius: 0.5rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 1rem;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .msg-mine {
      align-self: flex-end;
      background-color: #0d6efd;
      color: #fff;
      border-bottom-right-radius: 0.2rem;
    }
    .msg-mine .text-time {
      color: rgba(255, 255, 255, 0.8);
    }
    .msg-other {
      align-self: flex-start;
      background-color: #ffffff;
      color: #212529;
      border: 1px solid #dee2e6;
      border-bottom-left-radius: 0.2rem;
    }
    .msg-system {
      align-self: center;
      font-size: 0.85rem;
      padding: 0.35rem 0.85rem;
      border-radius: 50rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-broadcast-pin me-2"></i>Aplicación WebSockets - Comunicación en Tiempo Real
      </span>
      <span class="badge bg-light text-primary" id="connectionStatusBadge">
        <i class="bi bi-circle-fill text-secondary me-1"></i> Desconectado
      </span>
    </div>
  </nav>

  <div class="container my-auto">
    <!-- SCREEN 1: USERNAME LOGIN -->
    <div class="row justify-content-center" id="loginCard">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 text-center">
            <div class="display-6 text-primary mb-3">
              <i class="bi bi-chat-dots-fill"></i>
            </div>
            <h4 class="card-title fw-bold">Bienvenido al Chat</h4>
            <p class="text-muted small">Demostración bidireccional sin sondeo constante (Polling)</p>

            <form id="loginForm" class="mt-4 text-start">
              <div class="mb-3">
                <label for="usernameInput" class="form-label fw-semibold">Nombre de Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                  <input type="text" id="usernameInput" class="form-control" placeholder="Ejemplo: Carlos" required autofocus>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Conectarse al Chat
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: REAL-TIME CHAT ROOM -->
    <div class="row justify-content-center d-none" id="chatCard">
      <div class="col-md-10 col-lg-8">
        <div class="card shadow-sm border-0">
          
          <!-- Chat Room Header -->
          <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
            <div>
              <span class="fw-bold fs-5 text-dark">Sala Principal</span>
              <span class="badge bg-success-subtle text-success border border-success-subtle ms-2" id="usersOnlineBadge">
                <i class="bi bi-people-fill me-1"></i> 1 usuario conectado
              </span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="text-muted small">Conectado como:</span>
              <span class="badge bg-primary fs-6" id="currentUsername">Tú</span>
              <button class="btn btn-outline-danger btn-sm ms-2" id="disconnectBtn" title="Desconectarse">
                <i class="bi bi-power"></i> Salir
              </button>
            </div>
          </div>

          <!-- Chat Container -->
          <div class="card-body p-3">
            <!-- Message Display Area -->
            <div class="chat-messages" id="chatMessages">
              <!-- Messages are appended dynamically here -->
            </div>

            <!-- Message Submission Form -->
            <form id="messageForm" class="mt-3">
              <div class="input-group">
                <input 
                  type="text" 
                  id="messageInput" 
                  class="form-control" 
                  placeholder="Escribe un mensaje para todos..." 
                  autocomplete="off" 
                  required
                >
                <button type="submit" class="btn btn-primary px-4 fw-semibold" id="sendBtn">
                  <i class="bi bi-send-fill me-1"></i> Enviar
                </button>
              </div>
              
            </form>
          </div>

        </div>
      </div>
    </div>

  </div>

  <footer class="mt-auto py-3 text-center text-muted small">
    Comunicación Bidireccional con WebSocket
  </footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Client-Side WebSocket Logic -->
  <script>
    let socket = null;
    let myUsername = '';

    const loginCard = document.getElementById('loginCard');
    const chatCard = document.getElementById('chatCard');
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const currentUsernameSpan = document.getElementById('currentUsername');
    const connectionStatusBadge = document.getElementById('connectionStatusBadge');
    const usersOnlineBadge = document.getElementById('usersOnlineBadge');
    const chatMessages = document.getElementById('chatMessages');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const disconnectBtn = document.getElementById('disconnectBtn');

    // Utility function to escape text and prevent XSS (HTML injection)
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Automatically scroll to the bottom of the chat container
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Establish WebSocket connection
    function connectWebSocket(username) {
      const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      const wsUrl = `${protocol}${window.location.host}/ws`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        // Update UI to connected state
        connectionStatusBadge.innerHTML = '<i class="bi bi-circle-fill text-success me-1"></i> Conectado';
        connectionStatusBadge.className = 'badge bg-light text-success border border-success-subtle';

        // Send 'join' event to register username on the server
        socket.send(JSON.stringify({
          type: 'join',
          username: username
        }));

        // Switch view from login to chat room
        loginCard.classList.add('d-none');
        chatCard.classList.remove('d-none');
        currentUsernameSpan.textContent = username;
        messageInput.focus();
      };

      // Listen for incoming WebSocket messages and process them
      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleIncomingMessage(data);
        } catch (err) {
          console.error('Error processing inconnectionStatusBadgecoming message:', err);
        }
      };

      // Handle server disconnection or connection drop
      socket.onclose = () => {
        connectionStatusBadge.innerHTML = '<i class="bi bi-circle-fill text-danger me-1"></i> Desconectado';
        connectionStatusBadge.className = 'badge bg-light text-danger border border-danger-subtle';
        appendSystemMessage({
          text: 'Te has desconectado del servidor.',
          timestamp: new Date().toLocaleTimeString('es-ES'),
          action: 'disconnect'
        });
      };

      socket.onerror = (err) => {
        console.error('WebSocket client error:', err);
      };
    }

    // Dispatch incoming message types (system notification vs. chat message)
    function handleIncomingMessage(data) {
      if (data.type === 'system') {
        // Update online user count badge if available
        if (data.users && Array.isArray(data.users)) {
          const count = data.users.length;
          usersOnlineBadge.innerHTML = `<i class="bi bi-people-fill me-1"></i> ${count} usuario${count === 1 ? '' : 's'} en línea`;
        }
        appendSystemMessage(data);
      } else if (data.type === 'chat') {
        appendChatMessage(data);
      }
    }

    // Render system notifications (User connected / User disconnected)
    function appendSystemMessage(data) {
      const isConnect = data.action === 'connect';
      const badgeClass = isConnect ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-warning-subtle text-dark border border-warning-subtle';
      const icon = isConnect ? 'bi-person-check-fill' : 'bi-person-dash-fill';

      const div = document.createElement('div');
      div.className = `msg-system ${badgeClass}`;
      div.innerHTML = `
        <i class="bi ${icon} me-1"></i>
        <span>${escapeHtml(data.text)}</span>
        <span class="ms-2 opacity-75 small"><i class="bi bi-clock me-1"></i>${escapeHtml(data.timestamp)}</span>
      `;

      chatMessages.appendChild(div);
      scrollToBottom();
    }

    // Render chat message bubble
    function appendChatMessage(data) {
      const isMine = data.username === myUsername;
      const div = document.createElement('div');
      div.className = `msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}`;

      if (isMine) {
        div.innerHTML = `
          <div class="fw-semibold small mb-1 text-end">Tú</div>
          <div class="text-break">${escapeHtml(data.text)}</div>
          <div class="text-end small text-time mt-1">
            <i class="bi bi-clock me-1"></i>${escapeHtml(data.timestamp)}
          </div>
        `;
      } else {
        div.innerHTML = `
          <div class="fw-bold small text-primary mb-1">
            <i class="bi bi-person me-1"></i>${escapeHtml(data.username)}
          </div>
          <div class="text-break">${escapeHtml(data.text)}</div>
          <div class="text-end small text-muted mt-1">
            <i class="bi bi-clock me-1"></i>${escapeHtml(data.timestamp)}
          </div>
        `;
      }

      chatMessages.appendChild(div);
      scrollToBottom();
    }

    // Handle username submission to join chat
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = usernameInput.value.trim();
      if (!name) return;

      myUsername = name;
      connectWebSocket(myUsername);
    });

    // Handle sending a chat message
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

      // Send payload to server via WebSocket
      socket.send(JSON.stringify({
        type: 'message',
        text: text
      }));

      messageInput.value = '';
      messageInput.focus();
    });

    // Handle voluntary disconnect button click
    disconnectBtn.addEventListener('click', () => {
      if (socket) {
        socket.close();
      }
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
